<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Nexus Chat Studio. Dein privater Arbeitsbereich für OpenRouter, Modellvergleiche und Prompts.">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#fcfcfd">
    <link rel="icon" href="/nexus.svg" type="image/svg+xml">
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <title>Nexus Chat Studio</title>
    <script>
      (() => {
        let choice = 'system';
        try { choice = JSON.parse(localStorage.getItem('nx_settings') || '{}').theme || 'system'; } catch {}
        const dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#17191d' : '#fcfcfd';
      })();
    </script>
  </head>
  <body>
    <div id="app-main"></div>
    <div id="studio-ui"></div>
    <div class="toast-container" id="toasts" aria-live="polite"></div>
    <noscript>Nexus Chat Studio benötigt JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
